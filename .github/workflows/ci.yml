name: Frezen CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frezen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Workspace tests and builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run workspace tests
        run: npm test

      - name: Build workspace packages
        run: npm run build:all
