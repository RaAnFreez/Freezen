name: Frezen CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frezen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Workspace tests and builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Luau runtime for VM integration tests
        run: |
          git clone --depth 1 https://github.com/luau-lang/luau.git "$RUNNER_TEMP/luau"
          make -C "$RUNNER_TEMP/luau" -j2 config=release luau
          LUAU_BIN="$(find "$RUNNER_TEMP/luau" -type f -name luau -perm -111 -print -quit)"
          test -n "$LUAU_BIN"
          echo "FREZEN_LUA_RUNTIME=$LUAU_BIN" >> "$GITHUB_ENV"
          echo "$(dirname "$LUAU_BIN")" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm install

      - name: Run workspace tests
        run: npm test

      - name: Build workspace packages
        run: npm run build:all

      - name: Verify dashboard bundle is deployable
        run: |
          rm -rf worker/public
          mkdir -p worker/public
          cp -R dashboard/dist/. worker/public/
          test -f worker/public/index.html
          grep -R -q 'vm-v3' worker/public
