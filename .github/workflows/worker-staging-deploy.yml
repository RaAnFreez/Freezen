name: Deploy Frezen Staging Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frezen-worker-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Validate, migrate, and deploy staging only
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Assert staging database and migration isolation
        run: |
          grep -F 'database_name = "frezen-staging"' wrangler.toml
          grep -F 'database_id = "99e921da-2c62-4179-a8c5-f6a2918c0deb"' wrangler.toml
          grep -F 'migrations_dir = "migrations-staging"' wrangler.toml
          grep -F 'database_id = "ff6e12e2-c59b-4891-812c-9ce0bbae64fc"' wrangler.toml
          grep -F 'FREZEN_CLIENT_LICENSE_API_ENABLED = "false"' wrangler.toml

      - name: Validate staging schema using SQLite
        run: python3 ../scripts/verify-staging-schema.py

      - name: Install worker dependencies
        run: npm install

      - name: Run Worker tests
        run: npm test

      - name: Apply migrations to staging D1 only
        run: npx wrangler d1 migrations apply frezen-staging --remote --env staging

      - name: Verify staging D1 schema
        run: >-
          npx wrangler d1 execute frezen-staging --remote --env staging
          --command "SELECT l.id, l.license_key_hash, l.product_id, l.status, l.expires_at, l.max_devices FROM licenses l JOIN products p ON p.id = l.product_id LEFT JOIN frezen_key_records kr ON kr.license_id = l.id LEFT JOIN frezen_key_limits kl ON kl.key_id = kr.id LIMIT 0; SELECT id, owner_id, license_id, hwid_hash, game_username, game_user_id, status FROM hwid_bindings_v2 LIMIT 0;"

      - name: Deploy staging Worker only
        run: npx wrangler deploy --env staging
