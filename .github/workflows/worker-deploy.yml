name: Deploy Frezen Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frezen-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm install

      - name: Run workspace tests
        run: npm test

      - name: Build dashboard for Worker assets
        run: npm run build -w dashboard -- --base=/dashboard/

      - name: Verify dashboard build contains latest HWID UI
        run: |
          test -f dashboard/dist/index.html
          grep -R "Identity ready\|IDENTITY NOT RECEIVED" dashboard/dist >/dev/null

      - name: Sync dashboard build into Worker assets
        run: |
          rm -rf worker/public/dashboard
          mkdir -p worker/public/dashboard
          cp -R dashboard/dist/. worker/public/dashboard/

      - name: Verify synced production dashboard
        run: |
          test -f worker/public/dashboard/index.html
          grep -R "Identity ready\|IDENTITY NOT RECEIVED" worker/public/dashboard >/dev/null

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy --env production
