name: Deploy Frezen Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frezen-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install worker dependencies
        run: npm install

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install

      - name: Build dashboard assets
        working-directory: dashboard
        run: npm run build

      - name: Stage dashboard assets for Worker
        working-directory: .
        run: |
          rm -rf worker/public
          mkdir -p worker/public
          cp -R dashboard/dist/. worker/public/
          test -f worker/public/index.html
          grep -R -q 'vm-v3' worker/public

      - name: Run tests
        run: npm test

      - name: Deploy Worker
        run: npx wrangler deploy --env production
