name = "frezen-control-system-v3"
main = "src/index.js"
compatibility_date = "2026-08-09"
workers_dev = true

[vars]
FREZEN_ENV = "development"

[env.staging]
name = "frezen-control-system-v3-staging"
workers_dev = true
vars = { FREZEN_ENV = "staging" }

[env.production]
name = "frezen-control-system-v3"
workers_dev = true
vars = { FREZEN_ENV = "production" }

# D1 bindings will be added after the three isolated D1 databases exist.
# Secrets must be configured with Wrangler/Cloudflare and must never be committed.

# Recommended deployment commands:
# npx wrangler deploy --env staging
# npx wrangler deploy --env production
