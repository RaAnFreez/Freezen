name = "frezen-control-system-v3"
main = "src/index.js"
compatibility_date = "2026-08-09"
workers_dev = true

[vars]
FREZEN_ENV = "development"

# Development uses local/default Worker configuration.
# D1 bindings and secrets are intentionally not committed.

[env.staging]
name = "frezen-control-system-v3-staging"
workers_dev = true
vars = { FREZEN_ENV = "staging" }

[env.production]
name = "frezen-control-system-v3"
workers_dev = true
vars = { FREZEN_ENV = "production" }

# Add D1 bindings per environment only after the Cloudflare databases exist.
# Keep database IDs and secrets out of source control when they are sensitive.
