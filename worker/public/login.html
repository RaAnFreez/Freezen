<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10"><meta name="robots" content="noindex,nofollow"><title>Frezen — Login</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef4ff;background:#080b10}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#18283d,#080b10 52%)}main{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(460px,100%);padding:26px;border:1px solid #29364a;border-radius:20px;background:#0e151fee;box-shadow:0 22px 70px #0009}.brand{color:#91a3ff;font-weight:900;letter-spacing:.12em;font-size:13px}.sub{color:#8997aa}.row{margin-top:15px}label{display:block;font-size:13px;color:#bdc8d8;margin-bottom:6px}input{width:100%;padding:13px;border-radius:11px;border:1px solid #33425a;background:#080f19;color:#fff;outline:0}input:focus{border-color:#7186ff}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:#617cff;color:#fff;font-weight:800}#msg{margin-top:14px;padding:12px;border-radius:10px;background:#121d2d;white-space:pre-wrap}.link{display:block;margin-top:14px;text-align:center;color:#9caeff}</style></head><body><main><section class="card"><div class="brand">FREZEN CONTROL SYSTEM V3</div><h1>Owner Login</h1><p class="sub">Sign in to your private control dashboard.</p><form id="form"><div class="row"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="row"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button type="submit">Sign In</button></form><div id="msg" hidden></div><a class="link" href="/setup/owner">Owner setup</a></section></main><script>const form=document.querySelector('#form'),msg=document.querySelector('#msg');form.addEventListener('submit',async e=>{e.preventDefault();msg.hidden=false;msg.textContent='Signing in…';try{const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value})});const d=await r.json().catch(()=>({}));if(r.ok){location.replace('/dashboard/')}else{msg.textContent=(d.error||'Login failed')+(d.request_id?'\nRequest ID: '+d.request_id:'')}}catch(err){msg.textContent='Network error: '+err.message}});</script></body></html>
