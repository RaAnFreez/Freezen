<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10"><meta name="robots" content="noindex,nofollow"><title>Frezen — Owner Setup</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef4ff;background:#080b10}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#18283d,#080b10 52%)}main{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(460px,100%);padding:26px;border:1px solid #29364a;border-radius:20px;background:#0e151fee;box-shadow:0 22px 70px #0009}.brand{color:#91a3ff;font-weight:900;letter-spacing:.12em;font-size:13px}.sub{color:#8997aa}.row{margin-top:15px}label{display:block;font-size:13px;color:#bdc8d8;margin-bottom:6px}input{width:100%;padding:13px;border-radius:11px;border:1px solid #33425a;background:#080f19;color:#fff;outline:0}input:focus{border-color:#7186ff}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:#617cff;color:#fff;font-weight:800}#msg{margin-top:14px;padding:12px;border-radius:10px;background:#121d2d;white-space:pre-wrap}.hint{font-size:12px;color:#758399;margin-top:12px;line-height:1.5}</style></head><body><main><section class="card"><div class="brand">FREZEN CONTROL SYSTEM V3</div><h1>Create Owner Account</h1><p class="sub">First-time production setup. This page calls the existing secure Owner Setup API.</p><form id="form"><div class="row"><label for="email">Owner Email</label><input id="email" type="email" autocomplete="email" required></div><div class="row"><label for="username">Username</label><input id="username" autocomplete="username" minlength="3" maxlength="64"></div><div class="row"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="12" required></div><div class="row"><label for="secret">Master Secret</label><input id="secret" type="password" autocomplete="off" required></div><button type="submit">Create Owner</button></form><div id="msg" hidden></div><div class="hint">The master secret is sent only in the request header. It is not saved in the browser or displayed after submission.</div></section></main><script>const form=document.querySelector('#form'),msg=document.querySelector('#msg');form.addEventListener('submit',async e=>{e.preventDefault();msg.hidden=false;msg.textContent='Creating owner…';try{const r=await fetch('/api/v1/setup/owner',{method:'POST',headers:{'content-type':'application/json','x-frezen-setup-secret':document.querySelector('#secret').value},body:JSON.stringify({email:document.querySelector('#email').value.trim(),username:document.querySelector('#username').value.trim()||null,password:document.querySelector('#password').value})});const d=await r.json().catch(()=>({}));if(r.ok){msg.textContent='Owner account created successfully. Redirecting to login…';setTimeout(()=>location.replace('/login'),900)}else{msg.textContent=(d.error||'Owner setup failed')+(d.request_id?'\nRequest ID: '+d.request_id:'')}}catch(err){msg.textContent='Network error: '+err.message}});</script></body></html>
